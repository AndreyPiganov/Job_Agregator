services:

# Infrastructure
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-example}
      POSTGRES_DB: ${POSTGRES_DB:-job}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5425}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - job-network

  redis:
    container_name: redis
    restart: unless-stopped
    init: true
    build:
      context: ./redis
      dockerfile: Dockerfile
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - job-network


# Services 
## Vacancy
  vacancy_service:
    container_name: vacancy_service
    restart: unless-stopped
    init: true
    build:
      context: ./vacancy_service
      dockerfile: Dockerfile_dev
    ports:
      - "127.0.0.1:${VACANCY_PORT:-5003}:5003"
      - "127.0.0.1:${VACANCY_GRPC_PORT:-50051}:50051"
    volumes:
      - ./vacancy_service:/app
      - ./var/log/vacancy_service:/var/log/vacancy-service
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    environment:
      PORT: "5003"
      GRPC_PORT: "50051"
      DATABASE_URL: postgresql://${POSTGRES_USER:-root}:${POSTGRES_PASSWORD:-example}@postgres:5432/${POSTGRES_DB:-job}?schema=public
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_DIR: /var/log/vacancy-service
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5003/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - job-network

## Gateway
  gateway_service:
    container_name: gateway_service
    restart: unless-stopped
    init: true
    build:
      context: ./gateway_service
      dockerfile: Dockerfile_dev
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-3000}:3000"
    volumes:
      - ./gateway_service/src:/app/src
      - ./gateway_service/test:/app/test
      - ./gateway_service/nest-cli.json:/app/nest-cli.json:ro
      - ./gateway_service/tsconfig.json:/app/tsconfig.json:ro
      - ./gateway_service/tsconfig.build.json:/app/tsconfig.build.json:ro
      - ./var/log/gateway_service:/var/log/gateway-service
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_DIR: /var/log/gateway-service
      PORT: "3000"
      VACANCY_GRPC_URL: vacancy_service:50051
      VACANCY_GRPC_TIMEOUT_MS: ${VACANCY_GRPC_TIMEOUT_MS:-3000}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me}
      REDIS_DB: "0"
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-500}
      CACHE_TTL_MS: ${CACHE_TTL_MS:-15000}
      CACHE_NAMESPACE: ${CACHE_NAMESPACE:-job-aggregator:gateway}
      CACHE_FAILURE_COOLDOWN_MS: ${CACHE_FAILURE_COOLDOWN_MS:-5000}
    depends_on:
      vacancy_service:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - job-network

  nginx:
    container_name: nginx
    restart: unless-stopped
    init: true
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${NGINX_PORT:-80}:80"
    depends_on:
      gateway_service:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - job-network

networks:
  job-network:
    driver: bridge

volumes:
  postgres:
  go-mod-cache:
  go-build-cache:
