user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format json escape=json
        '{"time":"$time_iso8601",'
        '"remote_ip":"$remote_addr",'
        '"request_id":"$request_id_header",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_duration":"$upstream_response_time"}';

    access_log /var/log/nginx/access.log json;

    sendfile on;
    keepalive_timeout 65;

    map $http_x_request_id $request_id_header {
        default $http_x_request_id;
        "" $request_id;
    }

    upstream gateway {
        server gateway_service:3000;
        keepalive 32;
    }

    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 10m;

        location = /nginx-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}\n';
        }

        location / {
            proxy_pass http://gateway;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id_header;

            add_header X-Request-ID $request_id_header always;

            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
